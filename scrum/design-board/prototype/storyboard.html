<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>看板故事板：项目流水线（丙 + 甲的阶段画法）</title>
<style>
  :root{
    --bg:#14171C; --panel:#1B1F26; --line:#3A414C; --node:#5B6470;
    --text:#E6E8EB; --dim:#8A93A0; --done:#7BC6A4; --now:#F5B942;
    --sprint:#6EA8FE; --design:#C792EA; --page:#0C0E11;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--text);
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;}
  .intro{max-width:1640px;margin:28px auto 8px;padding:0 24px}
  .intro h1{font-size:22px;margin:0 0 6px}
  .intro p{color:var(--dim);margin:4px 0;font-size:14px;line-height:1.6}
  .board{display:flex;flex-wrap:wrap;gap:34px 26px;max-width:1640px;margin:18px auto 40px;padding:0 24px;align-items:flex-start}
  .frame{display:flex;flex-direction:column;gap:10px}
  .cap{width:var(--w);font-size:13px;line-height:1.55;color:var(--dim)}
  .cap b{color:var(--text);font-size:15px;display:block;margin-bottom:2px}
  .cap i{font-style:normal;color:var(--now)}
  .screen{position:relative;width:var(--w);height:var(--h);background:var(--bg);border-radius:14px;
    border:1px solid #2A3038;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.45)}
  .portrait{--w:405px;--h:720px}
  .desktop{--w:720px;--h:405px}
  .phone{--w:300px;--h:650px}
  .mono{font-family:Consolas,"Cascadia Mono",monospace}
  /* header */
  .hd{padding:16px 18px 10px}
  .hd .top{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
  .hd .goal{font-size:17px;font-weight:700;line-height:1.45;margin-top:8px}
  .hd .goal small{display:block;font-size:10px;font-weight:400;color:var(--dim);margin-bottom:2px;letter-spacing:.08em}
  /* root */
  .root{display:flex;flex-direction:column;align-items:center;margin:6px 0 0}
  .root .dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--text);display:grid;place-items:center;font-size:10px}
  .root .stem{width:2px;height:16px;background:var(--line)}
  .rail{height:2px;background:var(--line);margin:0 34px}
  /* lane */
  .lane{margin:12px 16px 0;padding:10px 12px 10px 14px;border-left:3px solid var(--c);background:rgba(255,255,255,.025);border-radius:0 10px 10px 0}
  .lane .t{font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
  .lane .t span{font-size:10px;color:var(--dim);font-weight:400}
  .stages{display:flex;align-items:flex-start;margin:12px 0 4px}
  .st{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;font-size:9.5px;color:var(--dim)}
  .st::before{content:"";position:absolute;top:9px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0}
  .st:first-child::before{display:none}
  .st.done::before,.st.now::before{background:var(--done)}
  .st .o{width:20px;height:20px;border-radius:50%;border:2px solid var(--node);background:var(--bg);z-index:1;display:grid;place-items:center;font-size:10px;color:#0E1A14}
  .st.done .o{background:var(--done);border-color:var(--done)}
  .st.now .o{background:var(--now);border-color:var(--now);box-shadow:0 0 0 5px rgba(245,185,66,.18),0 0 18px rgba(245,185,66,.55)}
  .st.now{color:var(--now);font-weight:700}
  .st small{margin-top:5px}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .chip{font-size:10px;padding:2px 7px;border-radius:9px;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);color:var(--text)}
  .chip.hot{border-color:var(--now)}
  .blocks{margin-top:8px;font-size:10.5px;color:var(--dim)}
  .blocks.open{color:var(--text)}
  .blist{margin:6px 0 0;padding:0;list-style:none;font-size:10px;line-height:1.75;color:var(--dim)}
  .blist li.ok{color:var(--text)} .blist li.ok::first-letter{color:var(--done)}
  .serve{font-size:10px;color:var(--design);margin:4px 16px 0 30px}
  /* folded */
  .pills{display:flex;gap:8px;flex-wrap:wrap;margin:16px 16px 0}
  .pill{font-size:11px;padding:4px 10px;border-radius:12px;background:var(--panel);color:var(--dim)}
  .pill b{color:var(--text);font-weight:600;margin-left:3px}
  .pill.open{color:var(--text);outline:1px solid var(--node)}
  .unfold{margin:8px 16px 0;display:flex;flex-wrap:wrap;gap:5px}
  /* sheet */
  .veil{position:absolute;inset:0;background:rgba(5,7,10,.55)}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-radius:16px 16px 0 0;padding:14px 18px 16px;border-top:1px solid #2E3540}
  .sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--node);margin:0 auto 10px}
  .sheet h3{margin:0 0 8px;font-size:15px}
  .sheet h3 em{font-style:normal;color:var(--now)}
  .kv{font-size:11px;line-height:1.6;margin:6px 0}
  .kv span{display:block;font-size:9.5px;color:var(--dim);letter-spacing:.06em}
  .link{margin-top:10px;font-size:11.5px;color:var(--sprint)}
  .mini{display:flex;flex-direction:column;gap:3px;margin-top:6px;font-size:10px}
  .mini div{display:flex;justify-content:space-between;border-left:2px solid var(--line);padding-left:8px;color:var(--dim)}
  .mini div.on{border-color:var(--now);color:var(--text)}
  .tap{position:absolute;width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 6px rgba(255,255,255,.18);pointer-events:none}
  .arrow{align-self:center;color:var(--node);font-size:26px;margin:0 -8px}
  /* desktop */
  .dk{display:grid;grid-template-columns:180px 1fr 210px;height:100%}
  .dk .left{padding:16px;border-right:1px solid #232831}
  .dk .left .goal{font-size:14px;font-weight:700;line-height:1.5;margin-top:8px}
  .dk .mid{padding:10px 6px}
  .dk .right{background:var(--panel);padding:14px 16px;border-left:1px solid #2E3540}
  .dk .lane{margin:10px 8px 0}
  /* phone */
  .ph .hd .goal{font-size:14px}
  .ph .lane{margin:10px 10px 0}
  .ph .st{font-size:8.5px}
  .ph .st .o{width:16px;height:16px}
  .ph .st::before{top:7px}
  /* blank */
  .ghost{margin:14px 16px 0;padding:22px 14px;border:1.5px dashed var(--node);border-radius:10px;text-align:center;font-size:12px;color:var(--dim)}
</style>
</head>
<body>
<div class="intro">
  <h1>看板故事板：项目流水线（丙为骨架，借甲的阶段画法）</h1>
  <p>示意用的静态画面，不是真网页；数据是本仓库 2026-11-14 的样子。一帧一个状态，说明里写「怎么到这一帧」和「想听你说什么」。</p>
  <p>读法：<span style="color:var(--done)">●</span> 已过 · <span style="color:var(--now)">●</span> 现在（全页唯一的亮色）· <span style="color:var(--node)">○</span> 未到；<span style="color:var(--sprint)">蓝</span> 是冲刺这条线，<span style="color:var(--design)">紫</span> 是设计这条线。白圈是手指点的地方。</p>
</div>
<div class="board" id="board"></div>

<script>
const D = {
  name:"IDEO-Scrum", time:"更新 11-14 06:10",
  product:"把 Design Thinking 与 Scrum Sprint 装进 Claude Code。",
  pgoal:"产品化：从作者能用到大家都好用；看板一眼看清进度，文档讲清规矩；懂 Scrum 的人照着就能走完第一个冲刺。",
  sgoal:"拿得出手：看板改版，好看、好读；README、快速上手、词汇表讲清规矩，发布包装补齐；懂 Scrum 的人照着就能装上、走完第一个冲刺，不问作者。",
  snow:"Increment：块 1、3、4、5、6、7 已完成；块 8 冒烟第 2 次跑完整了……",
  dgoal:"一眼就知道：看板挂在 PO 的屏上，好看、形象；PO 隔一阵瞄一眼，就知道项目走到哪、每条线在做什么……",
  dnow:"Ideate：两个子代理各画一个方案；同时 Master 和 PO 聊 PO 心里的画面",
  blocks:[["✓","开场包"],["","设计线 68-a"],["✓","CHANGELOG 与图标候选"],["✓","三份大纲"],["✓","README（中英）"],["✓","快速上手与词汇表"],["✓","63-a 标准与测法"],["","63-a 脚本与冒烟"],["","68-b 合并与模板"],["","…… 还有 6 块"]]
};
const S5=["Why","What","How","Incr","Test"], D5=["共情","定义","构思","原型","测试"];
const stages=(names,cur,cls="")=>`<div class="stages">${names.map((n,i)=>`<div class="st ${i<cur?'done':i==cur?'now':''}"><div class="o">${i<cur?'✓':''}</div><small>${n}</small></div>`).join("")}</div>`;
const hd=(goalSize)=>`<div class="hd"><div class="top"><span>${D.name}</span><span class="mono">${D.time}</span></div><div class="goal" ${goalSize?`style="font-size:${goalSize}px"`:''}><small>PRODUCT GOAL</small>${D.pgoal}</div></div>`;
const root=()=>`<div class="root"><div class="dot">产品</div><div class="stem"></div></div><div class="rail"></div>`;
const chips=(hot)=>`<div class="chips">${[["68","看板改版"],["64","发布包装"],["62","教学"],["63","体验测试"]].map(([n,t])=>`<span class="chip ${hot==n?'hot':''}">PBI-${n} ${t}</span>`).join("")}</div>`;
const sprintLane=(o={})=>`<div class="lane" style="--c:var(--sprint)"><div class="t">Sprint 20 · 拿得出手<span>冲刺</span></div>${stages(S5,3)}${chips(o.hot)}${o.open?`<div class="blocks open">工作块 ✓ 6 / 15 ▾</div><ul class="blist">${D.blocks.map(([k,t])=>`<li class="${k?'ok':''}">${k||'·'} ${t}</li>`).join("")}</ul>`:`<div class="blocks">工作块 ✓ 6 / 15 ▸</div>`}</div>`;
const designLane=()=>`<div class="serve">↳ 为 PBI-68 开的设计</div><div class="lane" style="--c:var(--design);margin-top:4px">${'<div class="t">设计 · 看板<span>设计冲刺</span></div>'}${stages(D5,2)}</div>`;
const pills=(open)=>`<div class="pills"><span class="pill">▸ 待选<b>1</b></span><span class="pill ${open?'open':''}">${open?'▾':'▸'} 以后<b>3</b></span><span class="pill">▸ 已收官<b>15</b></span></div>${open?`<div class="unfold"><span class="chip" style="--c:var(--node)">PBI-69 Retro 只存要点</span><span class="chip" style="--c:var(--node)">PBI-51 插件的记忆机制</span><span class="chip" style="--c:var(--node)">PBI-12 方法论分享</span></div>`:''}`;
const tap=(x,y)=>`<div class="tap" style="left:${x}px;top:${y}px"></div>`;
const sheetSprint=()=>`<div class="veil"></div><div class="sheet"><div class="grab"></div><h3>Sprint 20 · 现在在 <em>Increment</em></h3><div class="kv"><span>SPRINT GOAL（原文）</span>${D.sgoal}</div><div class="kv"><span>NOW（原文）</span>${D.snow}</div><div class="kv"><span>工作块</span>✓ 6 / 15 · 下一个：68-b 合并与模板（等设计）</div><div class="link">打开冲刺日志 →</div></div>`;
const sheetProduct=()=>`<div class="veil"></div><div class="sheet"><div class="grab"></div><h3>产品</h3><div class="kv"><span>PRODUCT（原文）</span>${D.name}：${D.product}</div><div class="kv"><span>架构（概括，节点名取自产品日志 2.2）</span></div><div class="mini"><div><b>① 装插件、读 README</b><span>62、64</span></div><div><b>② 召唤角色</b><span>67</span></div><div><b>③ 写产品日志</b><span></span></div><div class="on"><b>④～⑥ Planning · 放行 · 施工</b><span>Sprint 20 在这</span></div><div><b>⑦～⑨ Test · Review · Retro</b><span>69</span></div></div><div class="link">打开产品日志 →</div></div>`;
const frames=[
 {cls:"portrait",title:"① 瞄一眼（竖屏，默认）",how:"挂在副屏上的样子。隔半小时抬头，只看两处亮点：蓝线停在 <i>Incr</i>，紫线停在 <i>构思</i>。",ask:"隔着一段距离，你一眼看得出两条线各走到哪吗？",
  body:()=>hd()+root()+sprintLane()+designLane()+pills()},
 {cls:"portrait",title:"② 点亮着的阶段 → 内容从底下滑出来",how:"手指点 Sprint 20 的 Incr。出来的是几行：Sprint Goal 原文、Now 原文、工作块进度，最后一个「打开冲刺日志」。",ask:"这几行够不够？要不要更多？",
  body:()=>hd()+root()+sprintLane()+designLane()+pills()+tap(256,237)+sheetSprint()},
 {cls:"portrait",title:"③ 点「工作块 ▸」→ 这条线自己展开",how:"像 GitHub Actions 的 Show all jobs：做完的打 ✓，没做的是点；再点一下收起。",ask:"展开在原地，还是也从底下滑出来，你更喜欢哪个？",
  body:()=>hd(15)+root()+sprintLane({open:true})+tap(14,325)},
 {cls:"portrait",title:"④ 点折叠的「以后 3」→ 展开成条目",how:"待选、以后、已收官平时折着只显示数字，点开才列出来。",ask:"折着只给数字，会不会让你觉得藏东西？",
  body:()=>hd()+root()+sprintLane()+designLane()+pills(true)+tap(102,487)},
 {cls:"portrait",title:"⑤ 点根节点「产品」→ 产品和架构图",how:"九步架构图不占首页，收在产品里：一条竖线概括，标出 Sprint 20 停在哪一段、哪些条目挂在哪。",ask:"架构图收进这里，你找得到吗？首页没有它，图还够形象吗？",
  body:()=>hd()+root()+sprintLane()+designLane()+pills()+tap(185,138)+sheetProduct()},
 {cls:"desktop",title:"⑥ 电脑全屏：从左往右流",how:"左边是产品和 Product Goal，中间一行一条线，右边固定一块放点开的内容。",ask:"电脑上这样排，顺不顺？",
  body:()=>`<div class="dk"><div class="left"><div style="font-size:11px;color:var(--dim)">${D.name} · <span class="mono">${D.time}</span></div><div class="goal">${D.pgoal}</div><div class="root" style="margin-top:16px"><div class="dot">产品</div></div></div><div class="mid">${sprintLane()}${designLane()}${pills()}</div><div class="right"><h3 style="margin:0 0 8px;font-size:14px">Sprint 20 · 现在在 <em style="font-style:normal;color:var(--now)">Increment</em></h3><div class="kv"><span>NOW（原文）</span>${D.snow}</div><div class="kv"><span>工作块</span>✓ 6 / 15</div><div class="link">打开冲刺日志 →</div></div></div>`},
 {cls:"phone",title:"⑦ 手机：单列，点开占满屏",how:"同一页变窄：一条线一张窄卡，阶段点变小；点开的内容占满整屏，返回回到图。",ask:"手机上只是顺带看，这样够吗？",
  body:()=>`<div class="ph">${hd(13)}${root()}${sprintLane()}${designLane()}${pills()}</div>`},
 {cls:"portrait",title:"⑧ 白纸项目：只有产品和目标",how:"还没开冲刺、没开设计时，下面是一个虚线的空组；折叠的数字是 0 就不显示。",ask:"空的时候这样，像设计过吗？",
  body:()=>hd()+root()+`<div class="ghost">第一个冲刺会出现在这里</div>`}
];
document.getElementById("board").innerHTML=frames.map((f,i)=>`<div class="frame ${f.cls}"><div class="screen">${f.body()}</div><div class="cap"><b>${f.title}</b>${f.how}<br><i>想听你说：</i>${f.ask}</div></div>`).join("");
</script>
</body>
</html>
