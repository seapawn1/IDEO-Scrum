<!doctype html>
<meta charset="utf-8">
<title>IDEO-Scrum icon candidates</title>
<style>
  body { margin: 0; font: 15px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; color: #1c2230; }
  .row { display: flex; }
  .pane { flex: 1; padding: 28px 32px 36px; }
  .light { background: #ffffff; }
  .dark { background: #0d1117; color: #e6edf3; }
  .set { display: flex; gap: 36px; align-items: flex-end; }
  figure { margin: 0; }
  figcaption { margin-top: 10px; font-weight: 600; }
  .small { display: flex; gap: 20px; align-items: center; margin-top: 28px; }
  .small span { color: #7a8497; font-size: 13px; }
  h2 { margin: 0 0 18px; font-size: 16px; }
</style>
<div class="row">
  <div class="pane light">
    <h2>浅色背景</h2>
    <div class="set">
      <figure><img src="icon-1-loop.svg" width="200" height="200"><figcaption>1 冲刺的环，绕着设计的菱形</figcaption></figure>
      <figure><img src="icon-2-notes.svg" width="200" height="200"><figcaption>2 三张便利贴</figcaption></figure>
      <figure><img src="icon-3-diamonds.svg" width="200" height="200"><figcaption>3 双钻石，带一个箭头</figcaption></figure>
    </div>
    <div class="small">
      <img src="icon-1-loop.svg" width="64" height="64"><img src="icon-2-notes.svg" width="64" height="64"><img src="icon-3-diamonds.svg" width="64" height="64">
      <img src="icon-1-loop.svg" width="32" height="32"><img src="icon-2-notes.svg" width="32" height="32"><img src="icon-3-diamonds.svg" width="32" height="32">
      <span>64 和 32 像素</span>
    </div>
  </div>
  <div class="pane dark">
    <h2>深色背景</h2>
    <div class="set">
      <figure><img src="icon-1-loop.svg" width="200" height="200"><figcaption>1</figcaption></figure>
      <figure><img src="icon-2-notes.svg" width="200" height="200"><figcaption>2</figcaption></figure>
      <figure><img src="icon-3-diamonds.svg" width="200" height="200"><figcaption>3</figcaption></figure>
    </div>
    <div class="small">
      <img src="icon-1-loop.svg" width="64" height="64"><img src="icon-2-notes.svg" width="64" height="64"><img src="icon-3-diamonds.svg" width="64" height="64">
      <img src="icon-1-loop.svg" width="32" height="32"><img src="icon-2-notes.svg" width="32" height="32"><img src="icon-3-diamonds.svg" width="32" height="32">
      <span>64 和 32 像素</span>
    </div>
  </div>
</div>
